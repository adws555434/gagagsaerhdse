name: Forecast integrity
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - index.html
      - 'assets/matchday*'
      - 'sim/**'
      - 'tests/event-*.mjs'
      - tests/forecast-learning-dom.cjs
      - tests/package.json
      - tests/package-lock.json
      - primary-score-report.json
      - tests/primary-score-replay.mjs
      - scripts/event-ledger.mjs
      - .github/workflows/event-forecast-ledger.yml
      - scripts/forecast-ledger.cjs
      - scripts/market-validation.cjs
      - tests/phase0-forecast-test.cjs
      - tests/phase1-backtest.cjs
      - tests/phase1-inputs.json
      - phase1-summary.json
      - 'tests/phase2-*.cjs'
      - tests/phase2-inputs.json
      - tests/phase2-archive-inputs.json
      - tests/phase2-timing-inputs.json
      - .github/workflows/market-history.yml
      - phase2-market-report.json
      - scripts/market-snapshot.cjs
      - .github/workflows/market-snapshot.yml
      - tests/forecast-learning-test.cjs
      - .github/workflows/forecast-integrity.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/phase0-forecast-test.cjs
      - run: node tests/forecast-learning-test.cjs
      - run: node tests/phase1-backtest.cjs --self-test
      - run: node tests/phase2-backtest.cjs --self-test
      - run: node tests/phase2-market-test.cjs
      - run: node tests/phase2-timing-test.cjs
      - run: node tests/phase2-live-test.cjs
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - run: node --test tests/event-simulation.test.mjs tests/event-ui.test.mjs
      - run: node tests/forecast-learning-dom.cjs
