name: Market probability snapshot
on:
  schedule:
    - cron: '23 1 * * *'
    - cron: '23 7 * * *'
    - cron: '23 13 * * *'
    - cron: '23 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: football-market-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/phase2-market-test.cjs
      - name: Calculate market probabilities
        env:
          ODDS_API_SCHEDULE: ${{ github.event.schedule }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_SCOPES: ${{ vars.ODDS_API_SCOPES }}
        run: node scripts/market-snapshot.cjs
      - name: Publish derived probabilities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh football market probabilities"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
          done
          exit 1
